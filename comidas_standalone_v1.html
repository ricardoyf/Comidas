    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif; background:var(--bg); color:var(--text); }

    .hero h1 { margin:0; font-size:28px; line-height:1.05; }
    .hero p { margin:7px 0 0; font-size:13px; line-height:1.4; opacity:.95; }
    .toolbar { display:flex; gap:8px; margin:0 0 12px; position:sticky; top:0; z-index:3; padding:8px 0; background:rgba(246,247,251,.96); }
    .tab { flex:1; border:1px solid var(--line); background:#fff; color:var(--text); border-radius:12px; min-height:42px; font-weight:900; font-size:14px; }
    .tab.active { background:#17212b; color:white; border-color:#17212b; }
    .grid { display:grid; grid-template-columns:1fr; gap:12px; }
    .card,.buy-card,.history-card { padding:14px; }
    .eyebrow { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:900; margin-bottom:7px; }
    .week-range { font-size:24px; font-weight:900; color:#1d4ed8; line-height:1.15; }
    .summary-note { margin-top:7px; font-size:13px; color:var(--muted); line-height:1.45; }
    .compact-line { font-size:15px; font-weight:850; line-height:1.45; padding:7px 0; border-bottom:1px dashed #e5e7eb; }
    .compact-line:last-child { border-bottom:0; }
    details.buy-card { overflow:hidden; padding:0; }
    details.buy-card>summary { list-style:none; cursor:pointer; padding:14px; background:linear-gradient(135deg,var(--green),#0ea5a5); color:white; font-size:18px; font-weight:900; display:flex; justify-content:space-between; }
    details.buy-card>summary::-webkit-details-marker { display:none; }
    .buy-inner { padding:12px 14px 14px; }
    .buy-help { font-size:12px; color:var(--muted); line-height:1.4; margin-bottom:10px; }
    .buy-groups { display:grid; grid-template-columns:1fr; gap:10px; }
    .buy-group { border:1px solid #dce7e6; border-radius:14px; padding:10px; background:#fbfefe; }
    .buy-group-title { font-size:14px; font-weight:900; color:var(--green); margin-bottom:6px; }
    .buy-items { display:grid; grid-template-columns:1fr; gap:4px; }
    .buy-item { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:14px; line-height:1.25; }
    .buy-item input { width:18px; height:18px; }
    .buy-item.checked span { text-decoration:line-through; color:#7b8794; }
    .history-list { display:grid; grid-template-columns:1fr; gap:7px; }
    .history-btn { width:100%; text-align:left; padding:10px 12px; border-radius:12px; background:#f8fafc; border:1px solid #e6eaf2; color:inherit; font-weight:800; font-size:14px; }

    .hidden { display:none; }
    .footer { text-align:center; color:var(--muted); font-size:11px; margin-top:10px; }
    @media (min-width:860px) { .grid { grid-template-columns:1fr 1fr; } .buy-groups { grid-template-columns:1fr 1fr; } .buy-items { grid-template-columns:1fr 1fr; column-gap:12px; } }

  <script>
    const DATA = JSON.parse(document.getElementById('comidas-data').textContent);
    const STORAGE_KEY = 'comidas_standalone_buy_checks_v1';
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    const esc = (s) => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    function lineHtml(line) { return `<div class="compact-line">${esc(line)}</div>`; }

    function renderActual() {
      document.getElementById('view-actual').innerHTML = `
        <section class="grid">
          <article class="card">
            <div class="eyebrow">Semana actual</div>
            <div class="week-range">${esc(DATA.current.range)}</div>
            <div class="summary-note">Semana actual en formato compacto: un golpe de vista arriba y la compra debajo.</div>
          </article>
          <article class="card">
            <div class="eyebrow">Resumen compacto</div>
            ${DATA.current.lines.map(lineHtml).join('')}
          </article>
        </section>`;
    }

    function renderCompra() {
      const groups = DATA.current.buyGroups.map(group => `
        <div class="buy-group">
          <div class="buy-group-title">${esc(group.title)}</div>
          <div class="buy-items">
            ${group.items.map(item => `
              <label class="buy-item ${saved[item.id] ? 'checked' : ''}">
                <input type="checkbox" data-buy-id="${esc(item.id)}" ${saved[item.id] ? 'checked' : ''}>
                <span>${esc(item.text)}</span>
              </label>`).join('')}
          </div>
        </div>`).join('');
      document.getElementById('view-compra').innerHTML = `
        <details class="buy-card" open>
          <summary><span>Lista de la compra</span><span>▾</span></summary>
          <div class="buy-inner">
            <div class="buy-help">Ordenada por departamentos. Las casillas se guardan en este navegador.</div>
            <div class="buy-groups">${groups}</div>
          </div>
        </details>`;
      document.querySelectorAll('[data-buy-id]').forEach(input => {
        input.addEventListener('change', () => {
          saved[input.dataset.buyId] = input.checked;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
          input.closest('.buy-item')?.classList.toggle('checked', input.checked);
        });
      });
    }

    function renderHistorico(selected = 0) {
      const week = DATA.history[selected] || DATA.history[0];
      document.getElementById('view-historico').innerHTML = `
        <section class="grid">
          <article class="history-card">
            <div class="eyebrow">Histórico</div>
            <div class="history-list">
              ${DATA.history.map((item, idx) => `<button class="history-btn" data-week="${idx}">Semana ${esc(item.range)}</button>`).join('')}
            </div>
          </article>
          <article class="card" id="history-detail">
            <div class="eyebrow">Semana histórica</div>
            <div class="week-range">${esc(week.range)}</div>
            <div class="summary-note">Vista compacta de la semana seleccionada.</div>
            ${week.lines.map(lineHtml).join('')}
          </article>
        </section>`;
      document.querySelectorAll('[data-week]').forEach(btn => btn.addEventListener('click', () => renderHistorico(Number(btn.dataset.week))));
    }

    function setView(name) {
      document.querySelectorAll('.tab').forEach(btn => btn.classList.toggle('active', btn.dataset.view === name));
      ['actual','compra','historico'].forEach(view => document.getElementById(`view-${view}`).classList.toggle('hidden', view !== name));
      if (name === 'compra') renderCompra();
      if (name === 'historico' && !document.getElementById('view-historico').innerHTML) renderHistorico();
      window.scrollTo({top:0, behavior:'smooth'});
    }

    renderActual();
    renderCompra();
    renderHistorico();
    document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
  </script>
